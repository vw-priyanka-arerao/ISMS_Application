spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/securesync}
    username: ${DB_USERNAME:securesync}
    password: ${DB_PASSWORD:securesync}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    default-property-inclusion: non_null
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
springdoc:
  swagger-ui:
    path: /swagger-ui.html
app:
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000
  security:
    demo-password: Password1!
    oauth2:
      enabled: false
      principal-claim: preferred_username
      role-mapping:
        employee: EMPLOYEE,ISMS_EMPLOYEE
        sdm: SDM,ISMS_SDM
        pd-head: PD_HEAD,PDHEAD,ISMS_PD_HEAD
        admin: ADMIN,ISMS_ADMIN
        auditor: AUDITOR,ISMS_AUDITOR
  notifications:
    review-reminder-hours: 24
    reminder-resend-hours: 24
    reminder-scan-ms: 900000
  ai:
    llm:
      enabled: ${LLM_ENABLED:false}
      token-url: ${LLM_TOKEN_URL:https://idp.cloud.vwgroup.com/auth/realms/kums-mfa/protocol/openid-connect/token}
      client-id: ${LLM_CLIENT_ID:}
      client-secret: ${LLM_CLIENT_SECRET:}
      base-url: ${LLM_BASE_URL:https://llmapi.ai.vwgroup.com}
      virtual-key: ${LLM_VIRTUAL_KEY:}
      model: ${LLM_MODEL:gpt-5-mini}

